name: Generar APK Parte Diario

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mobile-android/**', '.github/workflows/build-android-apk.yml']

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK instalable
        working-directory: mobile-android
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Parte-Diario-Fabulosa-APK
          path: mobile-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Publicar APK descargable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.0.2
          name: Parte Diario Fabulosa 1.0.2
          body: APK conectada a https://fabulosa.javaltecnologia.es/movil/cartillas
          files: mobile-android/app/build/outputs/apk/debug/app-debug.apk
