plugins { id 'com.android.application' }

android {
    namespace 'com.fabulosa.partediario'
    compileSdk 35

    defaultConfig {
        applicationId 'com.fabulosa.partediario'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
        buildConfigField 'String', 'SERVER_URL', '"http://192.168.1.59:8000/movil"'
    }

    buildFeatures { buildConfig true }
    buildTypes {
        release { minifyEnabled false }
    }
}
